{% extends 'shop/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p>Подтвердите удаление: <strong>{{ object }}</strong>.</p>
<form class="form" method="post">
    {% csrf_token %}
    <button class="danger" type="submit">Удалить</button>
    <a class="button secondary" href="{{ object.get_absolute_url }}">Отмена</a>
</form>
{% endblock %}
