{% extends 'shop/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form class="form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
    <a class="button secondary" href="{{ request.META.HTTP_REFERER|default:'/' }}">Назад</a>
</form>
{% endblock %}
